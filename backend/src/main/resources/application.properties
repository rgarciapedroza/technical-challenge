spring.application.name=backend
server.port=8080

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/internal_requests}
spring.datasource.username=${DB_USERNAME:app}
spring.datasource.password=${DB_PASSWORD:app}

# Development only; production should use versioned database migrations.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

server.error.include-stacktrace=never
server.error.include-message=never
